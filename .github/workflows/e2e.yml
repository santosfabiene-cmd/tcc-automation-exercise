name: TCC - Testes Web
run-name: Testes Web - ${{ github.event_name }}
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar os dez casos em Chrome
        run: npm run test:css
      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
      - name: Publicar screenshots de falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 14
